grumphp:
    stop_on_failure: true
    ascii:
        failed: ~
        succeeded: ~
    tasks:
        # 1. Formatter: Pint must report no style issues (run `composer lint` to fix)
        shell:
            scripts:
                - ["-c", "vendor/bin/pint --test"]
            metadata:
                label: pint
                priority: 300

        # 2. Static analysis: Larastan across the whole project (phpstan.neon)
        phpstan:
            configuration: phpstan.neon
            memory_limit: 1G
            use_grumphp_paths: false
            metadata:
                priority: 200

        # 3. Commit message: Conventional Commits, e.g. "feat: add contact page"
        git_commit_message:
            enforce_capitalized_subject: false
            max_subject_width: 72
            type_scope_conventions:
                types:
                    - build
                    - chore
                    - ci
                    - docs
                    - feat
                    - fix
                    - perf
                    - refactor
                    - revert
                    - style
                    - test
                scopes: []
